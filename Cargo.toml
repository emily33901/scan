[workspace]
members = [".", "scan-plan"]
resolver = "2"

[package]
name = "scan"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[features]
default = []
fault-contained = []
test-support = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
scan-plan = { path = "scan-plan", default-features = false }
bitflags = "2"
bytemuck = "1"
parking_lot = "0.12.1"
libloading = "0.8.3"
paste = "1.0.15"
thiserror = "2"

cranelift = "0.119"
cranelift-module = "0.119"
cranelift-jit = "0.119"

[dev-dependencies]
proptest = "=1.10.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = { git = "https://github.com/JohnTitor/mach2", rev = "3cec3b366f47b05b6f2807d47822bb34e462d0fb" }

[target.'cfg(target_os = "windows")'.dependencies]
retour = { version = "0.3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.52"
features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Threading",
]
